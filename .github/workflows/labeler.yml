name: Label PRs by OS

on:
  # pull_request_target runs the workflow from the base branch with a token
  # that can label PRs from forks too. It never checks out the PR's code.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          # Drop linux/macos again when later pushes stop touching those paths
          sync-labels: true
