# Cheatsheet menu on prefix + Space, like NvChad's <leader>ch. Plain tmux
# display-menu: no plugin, no build step. Sourced by tmux.conf.
#
# The menus are for memorizing the bindings: every menu key is the key that
# does the same thing after the prefix, and every submenu has a prefix binding
# of its own (prefix W opens Windows), so Space W c and prefix W c match.
# Keep them in sync when a binding changes.
#
# Each menu is a command alias (wk-*), so a submenu item just names its alias,
# and "stay open" items run their command and then reopen their own menu.
# Item syntax: 'Label' KEY COMMAND, where COMMAND can be a { ... } block;
# '' is a separator and a label starting with '-' is a note that can't be
# picked. Items that reopen their own menu are quoted strings, not { } blocks:
# tmux parses blocks (and expands aliases in them) right away, so a block
# naming its own alias is an alias loop. Prompt templates are strings with
# '%%', not { } blocks: that's the only form that keeps a reply with ' or "
# intact (tmux's own prefix + , mangles it's into it'\''s).

set -s command-alias[200] "wk-root=display-menu -T '#[align=centre,fg=green,bold]tmux' -x R -y 0 \
  'Command prompt' : command-prompt \
  'Describe a key' / { command-prompt -k -p key \"list-keys -1N '%%'\" } \
  'All keys' ? { list-keys -N } \
  '' \
  'New AI window' a { source-file ~/.config/tmux/ai-prompt.conf } \
  'Last window' l last-window \
  'Last pane' ';' last-pane \
  'Zoom pane' z { resize-pane -Z } \
  'Copy mode' '[' copy-mode \
  '' \
  '+Windows' W wk-windows \
  '+Panes' P wk-panes \
  '+Sessions' S wk-sessions \
  '+Window color' C wk-color \
  '' \
  'Reload config' r { source-file ~/.config/tmux/tmux.conf ; display 'tmux.conf reloaded' }"

set -s command-alias[201] "wk-windows=display-menu -T '#[align=centre,bold]Windows' -x R -y 0 \
  'Choose window' w { choose-tree -Zw } \
  'New window' c { new-window -c '#{pane_current_path}' } \
  Next n 'next-window ; wk-windows' \
  Previous p 'previous-window ; wk-windows' \
  Last l last-window \
  'Go to number' \"'\" { command-prompt -p 'Window number:' \"select-window -t ':%%'\" } \
  '-0 to 9 go straight to that window' '' '' \
  'Find window' f { command-prompt -p 'Find:' \"find-window -Z -- '%%'\" } \
  '' \
  'Split right' % { split-window -h -c '#{pane_current_path}' } \
  'Split down' '\"' { split-window -v -c '#{pane_current_path}' } \
  'Rotate panes' C-o 'rotate-window ; wk-windows' \
  'Spread panes evenly' E { select-layout -E } \
  '' \
  Rename ',' { command-prompt -p 'Rename window:' -I '#W' \"rename-window -- '%%'\" } \
  'Move to number' . { command-prompt -p 'Move window to:' \"move-window -t '%%'\" } \
  '+Color' C wk-color \
  'Clear agent status' A { set -wu @agent_state } \
  Kill '&' { confirm-before -p 'Kill window #W? (y/n)' kill-window }"

set -s command-alias[202] "wk-panes=display-menu -T '#[align=centre,bold]Panes' -x R -y 0 \
  'Pick by number' q { display-panes -d 0 } \
  'Last pane' ';' last-pane \
  'Next pane' o 'select-pane -t :.+ ; wk-panes' \
  'Move left' Left { select-pane -L } \
  'Move down' Down { select-pane -D } \
  'Move up' Up { select-pane -U } \
  'Move right' Right { select-pane -R } \
  '-No prefix: C-h C-j C-k C-l, also across Neovim' '' '' \
  '' \
  Zoom z { resize-pane -Z } \
  'Swap with previous' '{' 'swap-pane -U ; wk-panes' \
  'Swap with next' '}' 'swap-pane -D ; wk-panes' \
  'Break to window' ! break-pane \
  '' \
  'Resize left' M-Left 'resize-pane -L 5 ; wk-panes' \
  'Resize down' M-Down 'resize-pane -D 5 ; wk-panes' \
  'Resize up' M-Up 'resize-pane -U 5 ; wk-panes' \
  'Resize right' M-Right 'resize-pane -R 5 ; wk-panes' \
  '-One cell at a time: C-Left C-Down C-Up C-Right' '' '' \
  '' \
  Kill x { confirm-before -p 'Kill pane #P? (y/n)' kill-pane }"

set -s command-alias[203] "wk-sessions=display-menu -T '#[align=centre,bold]Sessions' -x R -y 0 \
  'Choose session' s { choose-tree -Zs } \
  Previous '(' 'switch-client -p ; wk-sessions' \
  Next ')' 'switch-client -n ; wk-sessions' \
  Last L { switch-client -l } \
  Rename '\$' { command-prompt -p 'Rename session:' -I '#S' \"rename-session -- '%%'\" } \
  Detach d detach-client"

set -s command-alias[204] "wk-color=display-menu -T '#[align=centre,bold]Window color' -x R -y 0 \
  '#[bg=colour203,fg=black] Red ' r { set -w @color colour203 } \
  '#[bg=colour215,fg=black] Orange ' o { set -w @color colour215 } \
  '#[bg=colour221,fg=black] Yellow ' y { set -w @color colour221 } \
  '#[bg=colour114,fg=black] Green ' g { set -w @color colour114 } \
  '#[bg=colour80,fg=black] Cyan ' c { set -w @color colour80 } \
  '#[bg=colour75,fg=black] Blue ' b { set -w @color colour75 } \
  '#[bg=colour141,fg=black] Purple ' p { set -w @color colour141 } \
  '#[bg=colour211,fg=black] Pink ' k { set -w @color colour211 } \
  '' \
  'Other (name or colour0-255)' : { command-prompt -p 'Color:' \"set -w @color '%%'\" } \
  'Default grey' d { set -wu @color }"

bind -N "Cheatsheet menu (which-key)" Space wk-root
bind -N "Windows menu" W wk-windows
bind -N "Panes menu" P wk-panes
bind -N "Sessions menu" S wk-sessions
bind -N "Window color menu" C wk-color
