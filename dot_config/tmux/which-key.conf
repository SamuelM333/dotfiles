# Cheatsheet menu on prefix + Space, like NvChad's <leader>ch. Plain tmux
# display-menu: no plugin, no build step. Sourced by tmux.conf.
#
# Each menu is a command alias (wk-*), so a submenu item just names its alias,
# and "stay open" items run their command and then reopen their own menu.
# Item syntax: 'Label' KEY COMMAND, where COMMAND can be a { ... } block;
# '' is a separator. Items that reopen their own menu are quoted strings, not
# { } blocks: tmux parses blocks (and expands aliases in them) right away, so
# a block naming its own alias is an alias loop. Prompt templates are strings
# with '%%', not { } blocks: that's the only form that keeps a reply with ' or "
# intact (tmux's own prefix + , mangles it's into it'\''s).

set -s command-alias[200] "wk-root=display-menu -T '#[align=centre,fg=green,bold]tmux' -x R -y 0 \
  'Run command' Space command-prompt \
  'Last window' Tab last-window \
  'Last pane' '`' last-pane \
  '' \
  '+AI' a wk-ai \
  '+Windows' w wk-windows \
  '+Panes' p wk-panes \
  '+Sessions' s wk-sessions \
  'Copy mode' c copy-mode \
  '' \
  'Reload config' r { source-file ~/.config/tmux/tmux.conf ; display 'tmux.conf reloaded' } \
  'All keys' ? { list-keys -N }"

set -s command-alias[201] "wk-ai=display-menu -T '#[align=centre,bold]AI' -x R -y 0 \
  'New agent window (ai)' a { source-file ~/.config/tmux/ai-prompt.conf } \
  'Set window color' c { command-prompt -p 'color:' \"set -w @color '%%'\" } \
  'Reset window color' C { set -wu @color } \
  'Clear agent status' x { set -wu @agent_state }"

set -s command-alias[202] "wk-windows=display-menu -T '#[align=centre,bold]Windows' -x R -y 0 \
  Choose w { choose-tree -Zw } \
  Last Tab last-window \
  Previous p 'previous-window ; wk-windows' \
  Next n 'next-window ; wk-windows' \
  New c { new-window -c '#{pane_current_path}' } \
  '' \
  'Split right' / { split-window -h -c '#{pane_current_path}' } \
  'Split down' - { split-window -v -c '#{pane_current_path}' } \
  Rotate o 'rotate-window ; wk-windows' \
  '' \
  Rename R { command-prompt -p 'Rename window:' -I '#W' \"rename-window -- '%%'\" } \
  Kill X { confirm-before -p 'Kill window #W? (y/n)' kill-window }"

set -s command-alias[203] "wk-panes=display-menu -T '#[align=centre,bold]Panes' -x R -y 0 \
  Choose p { display-panes -d 0 } \
  Last Tab last-pane \
  '' \
  Zoom z { resize-pane -Z } \
  '+Resize' r wk-resize \
  'Swap left' H { swap-pane -t '{left-of}' } \
  'Swap right' L { swap-pane -t '{right-of}' } \
  'Break to window' ! break-pane \
  '' \
  Kill X { confirm-before -p 'Kill pane #P? (y/n)' kill-pane }"

set -s command-alias[204] "wk-resize=display-menu -T '#[align=centre,bold]Resize' -x R -y 0 \
  Left h 'resize-pane -L 5 ; wk-resize' \
  Down j 'resize-pane -D 5 ; wk-resize' \
  Up k 'resize-pane -U 5 ; wk-resize' \
  Right l 'resize-pane -R 5 ; wk-resize'"

set -s command-alias[205] "wk-sessions=display-menu -T '#[align=centre,bold]Sessions' -x R -y 0 \
  Choose s { choose-tree -Zs } \
  Rename r { command-prompt -p 'Rename session:' -I '#S' \"rename-session -- '%%'\" } \
  Detach d detach-client"

bind -N "Cheatsheet menu (which-key)" Space wk-root
