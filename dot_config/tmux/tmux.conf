# tmux config for running AI agents next to Neovim inside Ghostty.
# Plugins are cloned by chezmoi (.chezmoiexternal.toml), no TPM needed.

# --- Terminal -----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks:usstyle"
set -as terminal-features ",xterm-256color:RGB"
# Plain interactive shell instead of a login shell, so macOS path_helper
# doesn't reorder PATH (Homebrew tools losing to system ones).
set -g default-command "${SHELL}"
set -sg escape-time 10
set -g focus-events on
# Shift+Enter and other modified keys reach the agent.
set -s extended-keys on
# Copy through OSC 52 to the system clipboard (Ghostty supports it).
set -g set-clipboard on
# Let agents' desktop notifications (OSC 9/777) through to Ghostty. `all`, not
# `on`: `on` drops passthrough from panes that aren't visible, so an agent in a
# background window couldn't notify.
set -g allow-passthrough all

# --- General --------------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S: #W"
setw -g mode-keys vi

# --- Bindings (prefix stays C-b) --------------------------------------------------
bind -N "Split right, same directory" % split-window -h -c "#{pane_current_path}"
bind -N "Split down, same directory" '"' split-window -v -c "#{pane_current_path}"
bind -N "New window, same directory" c new-window -c "#{pane_current_path}"
bind -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind -N "New AI window (ai [TITLE] [COLOR])" a source-file ~/.config/tmux/ai-prompt.conf

# --- Window colors and agent status -------------------------------------------------
# `ai TITLE COLOR` sets @color on the window; others use this default.
setw -g @color colour244
# Agent hooks (`just -g agent-state`) set @agent_state to working, waiting or done.
bind -N "Clear agent status" A set -wu @agent_state
set -g @agent_icon "#{?#{==:#{@agent_state},working}, ⏳,}#{?#{==:#{@agent_state},waiting}, 🔔,}#{?#{==:#{@agent_state},done}, ✅,}"

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bold]#{?client_prefix,#[reverse],} #S #[default] "
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[default] ,}%H:%M "
set -g window-status-separator " "
setw -g window-status-format "#[bg=#{@color},fg=black] #I #W#{E:@agent_icon} "
setw -g window-status-current-format "#[bg=#{@color},fg=black,bold,underscore]▶#I #W#{E:@agent_icon} "
# An agent ringing the bell in a background window highlights its tab.
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off
setw -g window-status-bell-style "reverse"
# Visiting a window clears its "waiting"/"done" mark.
set-hook -g after-select-window 'if -F "#{||:#{==:#{@agent_state},waiting},#{==:#{@agent_state},done}}" "set -wu @agent_state"'

# --- Plugins ------------------------------------------------------------------------
# Seamless C-h/j/k/l between Neovim splits and tmux panes (Neovim side lives in NvChad).
run-shell "~/.config/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux"

# --- Cheatsheet -----------------------------------------------------------------------
# Like NvChad's <leader>ch: prefix + Space opens a which-key style menu, built
# with tmux's own display-menu (no plugin).
source-file ~/.config/tmux/which-key.conf
