# Prompt for `ai [TITLE] [COLOR]` (just -g ai) and run it in the current pane's directory.
# Sourced by the prefix + a binding and the which-key menu. A blank title always
# opens a new window named after the directory (AI_NEW_WINDOW); a typed title
# switches to its window if it exists.
command-prompt -p "title (blank: new window named after dir):,color (optional):" { run-shell -c "#{pane_current_path}" "AI_NEW_WINDOW=1 just -g ai '%1' '%2'" }
